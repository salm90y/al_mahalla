name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Prepare Build Tools
        run: |
          SDKMANAGER=$(which sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses || true
            $SDKMANAGER --install "cmake;3.22.1" || true
          fi
          echo "=== Pre-installed NDK versions ==="
          ls -la "$ANDROID_HOME/ndk" 2>/dev/null || true
          echo "=== Pre-installed CMake versions ==="
          ls -la "$ANDROID_HOME/cmake" 2>/dev/null || true

      - name: Verify Android project structure
        run: |
          test -f android/gradlew
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Show build environment
        working-directory: ./android
        run: |
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Clean Android project
        working-directory: ./android
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Android APK
        working-directory: ./android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Generated APK
        run: |
          echo "=== Generated Single APK File ==="
          ls -lh android/app/build/outputs/apk/release/*.apk || ls -lh android/app/build/outputs/apk/debug/*.apk || true

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMahalla-v1.1.0-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
