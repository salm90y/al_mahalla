name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Worker Bundle
        run: |
          npx --yes esbuild worker/src/index.ts --bundle --outfile=worker.js --platform=browser --target=es2022 --format=esm
          mkdir -p dist public
          cp worker.js dist/worker.bundle.js
          cp worker.js public/worker.js

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ℹ️ CLOUDFLARE_API_TOKEN is not configured in GitHub Secrets. Skipping Cloudflare Worker deployment."
            echo "To enable auto-deploy, add CLOUDFLARE_API_TOKEN in GitHub Repository Settings -> Secrets -> Actions."
            exit 0
          fi
          echo "🚀 Deploying Worker using Wrangler..."
          npx --yes wrangler deploy
